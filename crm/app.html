<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPTIVANTA CRM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#f5f6f8;color:#475467}.box{text-align:center}.spin{width:34px;height:34px;border:3px solid #d0d5dd;border-top-color:#315fbd;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}iframe{border:0;width:100%;height:100%;display:none;background:#fff}#syncbar{position:fixed;z-index:30;right:18px;bottom:16px;background:#fff;border:1px solid #d0d5dd;border-radius:6px;padding:7px 10px;font-size:12px;color:#475467;box-shadow:0 5px 18px rgba(0,0,0,.08);display:none}#syncbar.error{color:#b42318;border-color:#f3b6b1}#syncbar.update{cursor:pointer;color:#2457a7;border-color:#bfd2f5}</style></head><body><div id="boot"><div class="box"><div class="spin"></div><strong id="bootText">正在连接数据库…</strong></div></div><iframe id="crmFrame" title="PEPTIVANTA CRM"></iframe><div id="syncbar">共享数据库 · 已同步</div><script>
const KEY='peptivanta-crm-v2',frame=document.getElementById('crmFrame'),boot=document.getElementById('boot'),syncbar=document.getElementById('syncbar');let user=null,revision=0,lastSynced='',dirty=false,syncing=false,timer=null,suppress=false,lastServerState='',lastPoll=0;
function localText(){return localStorage.getItem(KEY)||''}function setLocal(state){suppress=true;const s=JSON.stringify(state);localStorage.setItem(KEY,s);lastSynced=s;suppress=false}function show(t,cls=''){syncbar.textContent=t;syncbar.className=cls;syncbar.style.display='block'}
async function req(url,opt={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}return{r,d}}
function permissions(p){return user?.permissions?.includes(p)}
async function refreshRemote(reload=true){const {r,d}=await req('/api/state');if(r.status===401){logout(false);return}if(!r.ok||!d.ok)throw new Error(d.message||d.error||'读取失败');revision=d.revision;setLocal(d.state);if(reload&&frame.src)frame.contentWindow.location.reload();return d}
async function syncNow(){if(syncing||!dirty)return;syncing=true;dirty=false;const text=localText();try{const state=JSON.parse(text||'{}');const{r,d}=await req('/api/state',{method:'PUT',body:JSON.stringify({revision,state})});if(r.status===409&&d.state){revision=d.revision;setLocal(d.state);show('检测到同事刚刚更新了数据，点击刷新','update');syncbar.onclick=()=>location.reload();return}if(!r.ok||!d.ok)throw new Error(d.message||d.error||'同步失败');revision=d.revision;lastSynced=text;show('共享数据库 · 已同步');}catch(e){dirty=true;show('共享数据库 · 同步失败：'+e.message,'error')}finally{syncing=false;if(dirty)timer=setTimeout(syncNow,1000)}}
function markDirty(){if(suppress)return;const t=localText();if(t===lastSynced)return;dirty=true;clearTimeout(timer);timer=setTimeout(syncNow,220)}
window.addEventListener('storage',e=>{if(e.key===KEY)markDirty()});setInterval(markDirty,350);
async function poll(){if(document.hidden||dirty||syncing)return;try{const{r,d}=await req('/api/state');if(r.status===401){logout(false);return}if(r.ok&&d.ok&&d.revision!==revision){show('共享数据库有新数据，点击刷新','update');syncbar.onclick=()=>{setLocal(d.state);revision=d.revision;location.reload()}}}catch{}}setInterval(poll,30000);
function injectSecurityUI(){const d=frame.contentDocument;if(!d)return;const top=d.querySelector('.topbar-actions');if(top&&!d.getElementById('cloudUserBadge')){const b=d.createElement('span');b.id='cloudUserBadge';b.style.cssText='font-size:12px;color:#475467;white-space:nowrap';b.textContent=user.displayName+' · '+user.permissionGroup;top.prepend(b);const guide=d.createElement('a');guide.href='./guide.html';guide.target='_blank';guide.className='button secondary';guide.textContent='使用说明';top.appendChild(guide);const out=d.createElement('button');out.className='button secondary';out.textContent='退出';out.onclick=()=>logout(true);top.appendChild(out)}
  const meta=d.querySelector('.sidebar-footer .user-meta');if(meta)meta.innerHTML='<strong>'+escapeHtml(user.displayName)+'</strong><small>'+escapeHtml(user.permissionGroup)+'</small>';const av=d.querySelector('.sidebar-footer .user-avatar');if(av)av.textContent=(user.displayName||'U').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
  d.querySelectorAll('[data-pool-filter="mine"],[data-pool-filter="team"]').forEach(x=>x.style.display='none');
  if(!permissions('数据分析')&&!permissions('小组数据分析')){const x=d.querySelector('[data-view="reports"]');if(x)x.style.display='none'}if(!permissions('子账号管理')&&!permissions('销售小组管理')&&!permissions('权限组管理')&&!permissions('系统设置')){const x=d.querySelector('[data-view="settings"]');if(x)x.style.display='none'}if(!permissions('数据导出')){const x=d.getElementById('exportBtn');if(x)x.style.display='none'}
  if(!permissions('成本利润')){const st=d.createElement('style');st.textContent='#view-orders th:nth-child(6),#view-orders td:nth-child(6){display:none!important}#orderKpis .mini-kpi:nth-child(3){display:none!important}';d.head.appendChild(st)}enhanceAccountForm(d)}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function enhanceAccountForm(d){if(!permissions('子账号管理'))return;const f=d.getElementById('accountForm');if(!f||f.dataset.cloud==='1')return;f.dataset.cloud='1';const grid=f.querySelector('.form-grid');if(!f.elements.namedItem('password')){const l=d.createElement('label');l.innerHTML='<span>初始密码 *</span><input name="password" type="password" minlength="10" required autocomplete="new-password"><small style="color:#98a2b3">至少10位。</small>';grid.appendChild(l)}f.addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();const x=Object.fromEntries(new frame.contentWindow.FormData(f));const payload={username:x.login,displayName:x.displayName,permissionGroup:x.permissionGroup,team:x.team,password:x.password,status:x.status,mustChangePassword:false,managedTeams:x.permissionGroup==='一级管理员'?[x.team]:[]};const{r,data}=await createUser(payload);if(!r.ok){alert('创建账号失败：'+data);return}await refreshRemote(false);frame.contentWindow.location.reload()},true)}
async function createUser(payload){const r=await fetch('/api/users',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});let d={};try{d=await r.json()}catch{}return{r,data:d.error||d.message||''}}
async function logout(clear=true){try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}catch{}if(clear)localStorage.removeItem(KEY);location.replace('./login.html')}
async function start(){const old=localText();const me=await req('/api/auth/me');if(me.r.status===401){location.replace('./login.html');return}if(!me.r.ok||!me.d.ok){document.getElementById('bootText').textContent=me.d.error==='db_binding_missing'?'尚未绑定 D1 数据库（绑定名必须为 DB）':'后端连接失败：'+(me.d.message||me.d.error||me.r.status);return}user=me.d.user;const st=await req('/api/state');if(!st.r.ok||!st.d.ok){document.getElementById('bootText').textContent='读取数据库失败：'+(st.d.message||st.d.error||st.r.status);return}revision=st.d.revision;let state=st.d.state;let oldObj={};try{oldObj=JSON.parse(old||'{}')}catch{}if(user.permissionGroup==='超级管理员'&&(state.customers||[]).length===0&&(oldObj.customers||[]).length>0&&!localStorage.getItem('pv-cloud-migration-choice')){const yes=confirm('检测到本机已有 '+(oldObj.customers||[]).length+' 位客户，而共享数据库为空。\n\n确定：迁移本机数据到 D1。\n取消：使用空数据库。');localStorage.setItem('pv-cloud-migration-choice',yes?'import':'empty');if(yes){const im=await req('/api/state',{method:'PUT',body:JSON.stringify({revision,state:oldObj})});if(im.r.ok&&im.d.ok){state=im.d.state;revision=im.d.revision}}}setLocal(state);frame.onload=()=>{injectSecurityUI();setTimeout(()=>injectSecurityUI(),400);boot.style.display='none';frame.style.display='block';syncbar.style.display='block'};frame.src='./v7.html?cloud=1'}start().catch(e=>{document.getElementById('bootText').textContent='启动失败：'+e.message});
</script></body></html>
