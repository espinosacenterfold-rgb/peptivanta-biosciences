<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPTIVANTA CRM 登录</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><meta name="theme-color" content="#10213d"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#eef1f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #d7dce2;border-radius:10px;box-shadow:0 18px 55px rgba(20,30,45,.1);padding:26px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.04em;font-size:18px}.brand:before{content:'P';width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#10213d,#2866d7);color:#fff;font-size:15px;letter-spacing:0}.sub{color:#667085;font-size:13px;margin:4px 0 22px 39px}h1{font-size:21px;margin:0 0 5px}.hint{font-size:13px;color:#667085;line-height:1.6;margin:0 0 18px}label{display:block;margin:12px 0 0;font-size:12px;color:#475467;font-weight:600}label small{display:block;margin-top:4px;color:#98a2b3;font-weight:400}input{width:100%;margin-top:6px;border:1px solid #cfd5dc;border-radius:6px;padding:10px 11px;font:inherit;outline:none}input:focus{border-color:#315fbd;box-shadow:0 0 0 3px rgba(49,95,189,.1)}button{width:100%;margin-top:18px;border:0;border-radius:6px;background:#1f4f9c;color:#fff;padding:11px;font:inherit;font-weight:700;cursor:pointer}.error{display:none;margin-top:14px;padding:10px 11px;border-left:3px solid #b42318;background:#fff1f0;color:#8a2c24;font-size:13px}.status{font-size:12px;color:#667085;margin-top:14px}.notice{display:none;margin-top:14px;padding:10px 11px;border-left:3px solid #315fbd;background:#f4f7ff;color:#344054;font-size:12px;line-height:1.55}</style></head><body><main class="card"><div class="brand">PEPTIVANTA</div><div class="sub">Sales CRM · 数据库</div><h1>登录客户管理系统</h1><p class="hint">账号权限和可见数据范围由管理员配置。</p><form id="loginForm"><label>登录账号<input name="username" autocomplete="username" required><small>请填写管理员创建时设置的“登录账号”，不要填写业务备注名。</small></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button id="loginBtn">登录</button></form><div class="notice" id="notice">数据库尚未创建管理员。使用临时管理员账号登录后，系统会自动创建超级管理员。</div><div class="error" id="error"></div><div class="status" id="status">正在检查数据库状态…</div></main><script src="./login.js"></script></body></html>
