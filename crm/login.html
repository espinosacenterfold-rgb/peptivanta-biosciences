<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPTIVANTA CRM 登录</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#eef1f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #d7dce2;border-radius:10px;box-shadow:0 18px 55px rgba(20,30,45,.1);padding:26px}.brand{font-weight:800;letter-spacing:.04em;font-size:18px}.sub{color:#667085;font-size:13px;margin:4px 0 22px}h1{font-size:21px;margin:0 0 5px}.hint{font-size:13px;color:#667085;line-height:1.6;margin:0 0 18px}label{display:block;margin:12px 0 0;font-size:12px;color:#475467;font-weight:600}input{width:100%;margin-top:6px;border:1px solid #cfd5dc;border-radius:6px;padding:10px 11px;font:inherit;outline:none}input:focus{border-color:#315fbd;box-shadow:0 0 0 3px rgba(49,95,189,.1)}button{width:100%;margin-top:18px;border:0;border-radius:6px;background:#1f4f9c;color:#fff;padding:11px;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#1f4f9c;border:1px solid #b7c6df}.error{display:none;margin-top:14px;padding:10px 11px;border-left:3px solid #b42318;background:#fff1f0;color:#8a2c24;font-size:13px}.status{font-size:12px;color:#667085;margin-top:14px}.setup{display:none}.badge{display:inline-block;font-size:11px;background:#eef4ff;color:#2457a7;border:1px solid #cfe0ff;border-radius:4px;padding:2px 6px;margin-left:5px}.credentials{display:none;margin-top:14px;padding:14px;border:1px solid #bfd2f5;background:#f7faff;border-radius:7px}.credentials .row{margin-top:8px}.credentials small{display:block;color:#667085;margin-bottom:3px}.credentials strong{font-size:14px;word-break:break-all}.credentials .warn{margin-top:10px;color:#9a6700;font-size:12px;line-height:1.5}</style></head><body><main class="card"><div class="brand">PEPTIVANTA</div><div class="sub">Sales CRM · 数据库</div><section id="login"><h1>登录客户管理系统</h1><p class="hint">账号权限和可见数据范围由管理员配置。</p><form id="loginForm"><label>登录账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section><section id="setup" class="setup"><h1>首次初始化 <span class="badge">仅一次</span></h1><p class="hint">系统会自动创建超级管理员账号 <strong>admin</strong>，并生成一条随机初始密码。你只需要输入 Cloudflare 中配置的 BOOTSTRAP_TOKEN。</p><form id="setupForm"><label>初始化口令<input name="token" type="password" required autocomplete="off"></label><button>自动创建超级管理员</button></form><div class="credentials" id="credentials"><div class="row"><small>管理员账号</small><strong id="createdUser">admin</strong></div><div class="row"><small>初始密码</small><strong id="createdPassword"></strong></div><button type="button" class="secondary" id="copyCredentials">复制账号和密码</button><button type="button" id="enterCrm">进入 CRM</button><div class="warn">这条初始密码只在本次页面显示一次，请先保存到你自己的密码管理器。</div></div></section><div class="error" id="error"></div><div class="status" id="status">正在检查系统状态…</div></main><script>
const $=s=>document.querySelector(s),err=t=>{const e=$('#error');e.textContent=t;e.style.display='block'},clear=()=>{$('#error').style.display='none'};
async function req(url,opts={}){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),8000);try{const r=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:ctrl.signal,...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}return{r,d}}finally{clearTimeout(timer)}}
async function init(){try{const{r,d}=await req('/api/auth/status');if(!r.ok||!d.ok){if(d.error==='db_binding_missing')err('尚未绑定 D1 数据库。请在 Cloudflare Pages 给项目添加 D1 binding，变量名必须是 DB，然后重新部署。');else err('后端状态检查失败：'+(d.message||d.error||r.status));$('#status').textContent='系统尚未就绪';return}$('#status').textContent=d.setupRequired?'数据库已连接，等待首次初始化':'数据库已连接';$('#setup').style.display=d.setupRequired?'block':'none';$('#login').style.display=d.setupRequired?'none':'block'}catch(e){err(e.name==='AbortError'?'数据库连接超时，请稍后重试。':'状态检查失败：'+e.message);$('#status').textContent='系统尚未就绪'}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();clear();const f=Object.fromEntries(new FormData(e.currentTarget));try{const{r,d}=await req('/api/auth/login',{method:'POST',body:JSON.stringify(f)});if(!r.ok||!d.ok){err(d.error==='invalid_credentials'?'账号或密码错误':'登录失败：'+(d.message||d.error||r.status));return}const p=new URLSearchParams(location.search).get('return');location.replace(p||'./')}catch(ex){err('登录请求失败：'+ex.message)}};
$('#setupForm').onsubmit=async e=>{e.preventDefault();clear();const f=Object.fromEntries(new FormData(e.currentTarget));const btn=e.currentTarget.querySelector('button');btn.disabled=true;btn.textContent='正在创建…';try{const{r,d}=await req('/api/auth/bootstrap',{method:'POST',body:JSON.stringify({token:f.token})});if(!r.ok||!d.ok){const m={invalid_bootstrap_token:'初始化口令不正确',bootstrap_secret_missing:'Cloudflare 尚未配置 BOOTSTRAP_TOKEN',already_initialized:'系统已经初始化，请直接登录'};err(m[d.error]||'初始化失败：'+(d.message||d.error||r.status));return}$('#createdUser').textContent=d.credentials?.username||'admin';$('#createdPassword').textContent=d.credentials?.temporaryPassword||'';$('#credentials').style.display='block';e.currentTarget.style.display='none';$('#status').textContent='超级管理员已创建'}catch(ex){err(ex.name==='AbortError'?'初始化请求超时，请重试。':'初始化失败：'+ex.message)}finally{btn.disabled=false;btn.textContent='自动创建超级管理员'}};
$('#copyCredentials').onclick=async()=>{const text='账号：'+$('#createdUser').textContent+'\n密码：'+$('#createdPassword').textContent;try{await navigator.clipboard.writeText(text);$('#copyCredentials').textContent='已复制'}catch{alert(text)}};
$('#enterCrm').onclick=()=>location.replace('./');
init();
</script></body></html>
