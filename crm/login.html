<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPTIVANTA CRM 登录</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#eef1f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #d7dce2;border-radius:10px;box-shadow:0 18px 55px rgba(20,30,45,.1);padding:26px}.brand{font-weight:800;letter-spacing:.04em;font-size:18px}.sub{color:#667085;font-size:13px;margin:4px 0 22px}h1{font-size:21px;margin:0 0 5px}.hint{font-size:13px;color:#667085;line-height:1.6;margin:0 0 18px}label{display:block;margin:12px 0 0;font-size:12px;color:#475467;font-weight:600}input{width:100%;margin-top:6px;border:1px solid #cfd5dc;border-radius:6px;padding:10px 11px;font:inherit;outline:none}input:focus{border-color:#315fbd;box-shadow:0 0 0 3px rgba(49,95,189,.1)}button{width:100%;margin-top:16px;border:0;border-radius:6px;background:#1f4f9c;color:#fff;padding:11px;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#1f4f9c;border:1px solid #b7c6df}.linkbtn{background:none;border:0;color:#2457a7;padding:5px 0;margin:12px 0 0;text-align:left;width:auto;font-weight:600}.error{display:none;margin-top:14px;padding:10px 11px;border-left:3px solid #b42318;background:#fff1f0;color:#8a2c24;font-size:13px}.status{font-size:12px;color:#667085;margin-top:14px}.recover{display:none;border-top:1px solid #e4e7ec;margin-top:18px;padding-top:18px}.credentials{display:none;margin-top:14px;padding:14px;border:1px solid #bfd2f5;background:#f7faff;border-radius:7px}.credentials .row{margin-top:8px}.credentials small{display:block;color:#667085;margin-bottom:3px}.credentials strong{font-size:14px;word-break:break-all}.warn{margin-top:10px;color:#9a6700;font-size:12px;line-height:1.5}</style></head><body><main class="card"><div class="brand">PEPTIVANTA</div><div class="sub">Sales CRM · 数据库</div><section id="login"><h1>登录客户管理系统</h1><p class="hint">账号权限和可见数据范围由管理员配置。</p><form id="loginForm"><label>登录账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><button class="linkbtn" id="showRecover" type="button">管理员初始化 / 恢复</button></section><section id="recover" class="recover"><h1>管理员初始化 / 恢复</h1><p class="hint">输入 Cloudflare 中的 BOOTSTRAP_TOKEN。系统会创建或重置超级管理员 <strong>admin</strong>，并生成一条新的随机密码。</p><form id="recoverForm"><label>初始化口令<input name="token" type="password" autocomplete="off" required></label><button>创建 / 重置 admin</button></form><div class="credentials" id="credentials"><div class="row"><small>管理员账号</small><strong id="createdUser">admin</strong></div><div class="row"><small>新密码</small><strong id="createdPassword"></strong></div><button type="button" class="secondary" id="copyCredentials">复制账号和密码</button><button type="button" id="enterCrm">进入 CRM</button><div class="warn">密码只在本次页面显示一次，请先保存。</div></div></section><div class="error" id="error"></div><div class="status" id="status">正在检查系统状态…</div></main><script>
const $=s=>document.querySelector(s);function err(t){const e=$('#error');e.textContent=t;e.style.display='block'}function clearErr(){$('#error').style.display='none'}
async function req(url,opts={},timeout=3000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:c.signal,...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}return{r,d}}finally{clearTimeout(t)}}
function showRecover(){clearErr();$('#recover').style.display='block';$('#login').style.display='none'}function showLogin(){$('#recover').style.display='none';$('#login').style.display='block'}
$('#showRecover').onclick=showRecover;
async function init(){try{const{r,d}=await req('/api/auth/status');if(r.ok&&d.ok){$('#status').textContent='数据库已连接';if(d.setupRequired)showRecover();else showLogin();return}$('#status').textContent='状态检查失败，可直接使用管理员初始化 / 恢复';if(d.error==='db_binding_missing')err('D1 数据库尚未绑定，变量名必须为 DB。')}catch(e){$('#status').textContent='状态检查超时，可直接使用管理员初始化 / 恢复';}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();clearErr();const f=Object.fromEntries(new FormData(e.currentTarget));try{const{r,d}=await req('/api/auth/login',{method:'POST',body:JSON.stringify(f)},8000);if(!r.ok||!d.ok){err(d.error==='invalid_credentials'?'账号或密码错误':'登录失败：'+(d.message||d.error||r.status));return}location.replace('./')}catch(ex){err('登录请求失败：'+(ex.name==='AbortError'?'请求超时':ex.message))}};
$('#recoverForm').onsubmit=async e=>{e.preventDefault();clearErr();const f=Object.fromEntries(new FormData(e.currentTarget));const b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='正在处理…';try{const{r,d}=await req('/api/auth/recover',{method:'POST',body:JSON.stringify({token:f.token})},12000);if(!r.ok||!d.ok){const m={invalid_bootstrap_token:'初始化口令不正确',bootstrap_secret_missing:'Cloudflare 尚未配置 BOOTSTRAP_TOKEN',db_binding_missing:'D1 数据库尚未绑定'};err(m[d.error]||'处理失败：'+(d.message||d.error||r.status));return}$('#createdUser').textContent=d.credentials?.username||'admin';$('#createdPassword').textContent=d.credentials?.temporaryPassword||'';$('#credentials').style.display='block';e.currentTarget.style.display='none';$('#status').textContent='超级管理员已就绪'}catch(ex){err('处理失败：'+(ex.name==='AbortError'?'请求超时':ex.message))}finally{b.disabled=false;b.textContent='创建 / 重置 admin'}};
$('#copyCredentials').onclick=async()=>{const text='账号：'+$('#createdUser').textContent+'\n密码：'+$('#createdPassword').textContent;try{await navigator.clipboard.writeText(text);$('#copyCredentials').textContent='已复制'}catch{alert(text)}};$('#enterCrm').onclick=()=>location.replace('./');init();
</script></body></html>
