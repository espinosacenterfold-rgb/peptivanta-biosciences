<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPTIVANTA CRM 登录</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#eef1f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #d7dce2;border-radius:10px;box-shadow:0 18px 55px rgba(20,30,45,.1);padding:26px}.brand{font-weight:800;letter-spacing:.04em;font-size:18px}.sub{color:#667085;font-size:13px;margin:4px 0 22px}h1{font-size:21px;margin:0 0 5px}.hint{font-size:13px;color:#667085;line-height:1.6;margin:0 0 18px}label{display:block;margin:12px 0 0;font-size:12px;color:#475467;font-weight:600}input{width:100%;margin-top:6px;border:1px solid #cfd5dc;border-radius:6px;padding:10px 11px;font:inherit;outline:none}input:focus{border-color:#315fbd;box-shadow:0 0 0 3px rgba(49,95,189,.1)}button{width:100%;margin-top:18px;border:0;border-radius:6px;background:#1f4f9c;color:#fff;padding:11px;font:inherit;font-weight:700;cursor:pointer}.error{display:none;margin-top:14px;padding:10px 11px;border-left:3px solid #b42318;background:#fff1f0;color:#8a2c24;font-size:13px}.status{font-size:12px;color:#667085;margin-top:14px}.setup{display:none}.badge{display:inline-block;font-size:11px;background:#eef4ff;color:#2457a7;border:1px solid #cfe0ff;border-radius:4px;padding:2px 6px;margin-left:5px}</style></head><body><main class="card"><div class="brand">PEPTIVANTA</div><div class="sub">Sales CRM · 共享数据库</div><section id="login"><h1>登录客户管理系统</h1><p class="hint">账号权限和可见数据范围由管理员配置。</p><form id="loginForm"><label>登录账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section><section id="setup" class="setup"><h1>首次初始化 <span class="badge">仅一次</span></h1><p class="hint">创建第一个超级管理员。需要填写 Cloudflare 中配置的 BOOTSTRAP_TOKEN。</p><form id="setupForm"><label>初始化口令<input name="token" type="password" required></label><label>管理员账号<input name="username" value="admin" required></label><label>管理员显示名<input name="displayName" value="Administrator" required></label><label>管理员密码<input name="password" type="password" minlength="10" required><small style="display:block;color:#98a2b3;margin-top:5px">至少 10 位。</small></label><button>创建超级管理员</button></form></section><div class="error" id="error"></div><div class="status" id="status">正在检查系统状态…</div></main><script>
const $=s=>document.querySelector(s),err=t=>{const e=$('#error');e.textContent=t;e.style.display='block'},clear=()=>{$('#error').style.display='none'};
async function req(url,opts={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}return{r,d}}
async function init(){const{r,d}=await req('/api/auth/status');if(!r.ok||!d.ok){if(d.error==='db_binding_missing')err('尚未绑定 D1 数据库。请在 Cloudflare Pages 给项目添加 D1 binding，变量名必须是 DB，然后重新部署。');else err('后端状态检查失败：'+(d.message||d.error||r.status));$('#status').textContent='系统尚未就绪';return}$('#status').textContent=d.setupRequired?'数据库已连接，等待首次初始化':'数据库已连接';$('#setup').style.display=d.setupRequired?'block':'none';$('#login').style.display=d.setupRequired?'none':'block'}
$('#loginForm').onsubmit=async e=>{e.preventDefault();clear();const f=Object.fromEntries(new FormData(e.currentTarget));const{r,d}=await req('/api/auth/login',{method:'POST',body:JSON.stringify(f)});if(!r.ok||!d.ok){err(d.error==='invalid_credentials'?'账号或密码错误':'登录失败：'+(d.message||d.error||r.status));return}const p=new URLSearchParams(location.search).get('return');location.replace(p||'./')};
$('#setupForm').onsubmit=async e=>{e.preventDefault();clear();const f=Object.fromEntries(new FormData(e.currentTarget));const{r,d}=await req('/api/auth/bootstrap',{method:'POST',body:JSON.stringify(f)});if(!r.ok||!d.ok){const m={invalid_bootstrap_token:'初始化口令不正确',bootstrap_secret_missing:'Cloudflare 尚未配置 BOOTSTRAP_TOKEN',password_too_short:'管理员密码至少 10 位'};err(m[d.error]||'初始化失败：'+(d.message||d.error||r.status));return}location.replace('./')};init();
</script></body></html>
